[project]
name = "alphafund-daily"
version = "0.1.0"
description = "每日 AI 境外基金投研與優選報告 — M1 資料管道"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15",
    "feedparser>=6.0",
    "httpx>=0.28",
    "lxml>=6.1",
    "pydantic>=2.13",
    "tenacity>=9.1",
]

[project.scripts]
alphafund = "alphafund.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphafund"]

[tool.pytest.ini_options]
testpaths = ["tests"]
